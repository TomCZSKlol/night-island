<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071a2b"><link rel="manifest" href="manifest.webmanifest"><title>NIGHT ISLAND</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061827;color:white;font-family:system-ui,Arial}#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#brand{position:absolute;top:12px;left:14px;font-weight:900;letter-spacing:2px;font-size:20px}#stats{position:absolute;top:14px;right:14px;text-align:right;font-weight:700}#bars{position:absolute;left:14px;bottom:18px;width:190px}.bar{height:12px;background:#25384b;border:1px solid #ffffff88;border-radius:8px;margin-top:6px;overflow:hidden}.fill{height:100%;width:100%}#hp{background:#35d66b}#shield{background:#38a9ff}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.85;white-space:nowrap}
#menu,#result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#061827dd,#102b48dd);z-index:5}.panel{width:min(90vw,420px);padding:28px;border:1px solid #7ad5ff66;border-radius:22px;background:#071a2bea;box-shadow:0 20px 70px #0009;text-align:center}h1{font-size:36px;letter-spacing:4px;margin:0 0 8px;color:#8be2ff}p{color:#c4d9e8;line-height:1.5}button{border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(90deg,#16a6df,#6a6cff);color:white;font-weight:900;font-size:16px}#result{display:none}
#mobile{position:fixed;inset:0;pointer-events:none;display:none}#stick{position:absolute;left:24px;bottom:42px;width:118px;height:118px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:44px;height:44px;border-radius:50%;background:#ffffff9c}.actions{position:absolute;right:20px;bottom:34px;display:flex;gap:10px;pointer-events:auto}.actions button{width:62px;height:62px;padding:4px;border-radius:50%;font-size:12px;touch-action:manipulation}@media(pointer:coarse){#mobile{display:block}#hint{bottom:170px}}
</style></head><body>
<div id="game"></div><div id="hud"><div id="brand">NIGHT ISLAND</div><div id="stats">ŽIVÍ: <span id="alive">13</span><br>ELIMINACE: <span id="kills">0</span><br><span id="clock">03:00</span></div><div id="bars">ŽIVOT<div class="bar"><div id="hp" class="fill"></div></div>ŠTÍT<div class="bar"><div id="shield" class="fill"></div></div></div><div id="hint">WASD · myš kamera · klik střelba · mezerník skok</div></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div class="actions"><button id="jump">SKOK</button><button id="fire">PALBA</button></div></div>
<div id="menu"><div class="panel"><h1>NIGHT ISLAND</h1><p>Poslední přeživší vyhrává. Prozkoumej ostrov a poraz protivníky!</p><p>Počítač: WASD, myš, mezerník a kliknutí. Mobil: joystick, tažení pro kameru a tlačítka.</p><button id="start">VSTOUPIT DO HRY</button></div></div>
<div id="result"><div class="panel"><h1 id="resultTitle">KONEC HRY</h1><p id="resultText"></p><button id="back">ZPĚT DO LOBBY</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const root=document.getElementById('game'),$=id=>document.getElementById(id);
let scene,camera,renderer,player,active=false,health=100,shield=50,kills=0,timeLeft=180,bots=[],keys={},yaw=0,pitch=-.22,velY=0,move={x:0,y:0},last=0;
function character(color){const g=new THREE.Group(),torso=new THREE.Mesh(new THREE.CapsuleGeometry(.65,.9,4,8),new THREE.MeshStandardMaterial({color}));torso.position.y=1.2;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,12,10),new THREE.MeshStandardMaterial({color:0xf0c6a0}));head.position.y=2.25;g.add(head);const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,1.2),new THREE.MeshStandardMaterial({color:0x202b36,metalness:.6}));gun.position.set(.55,1.4,-.55);g.add(gun);return g}
function makeWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x79bde0);scene.fog=new THREE.Fog(0x79bde0,55,150);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,250);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.innerHTML='';root.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xcceeff,0x31523a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-30,60,20);sun.castShadow=true;scene.add(sun);
 const sea=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x176b91}));sea.rotation.x=-Math.PI/2;sea.position.y=-2;scene.add(sea);
 const island=new THREE.Mesh(new THREE.CylinderGeometry(62,70,8,64),new THREE.MeshStandardMaterial({color:0x43864a}));island.position.y=-1;scene.add(island);
 const ground=new THREE.Mesh(new THREE.CircleGeometry(61,64),new THREE.MeshStandardMaterial({color:0x5eaa58}));ground.rotation.x=-Math.PI/2;ground.position.y=3.05;scene.add(ground);
 for(let i=0;i<9;i++){const a=i*.7,h=new THREE.Mesh(new THREE.ConeGeometry(10,15,6),new THREE.MeshStandardMaterial({color:0x668c51}));h.position.set(Math.cos(a)*30,5,Math.sin(a)*30);scene.add(h)}
 for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*45,x=Math.cos(a)*r,z=Math.sin(a)*r;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,2,6),new THREE.MeshStandardMaterial({color:0x68452b}));trunk.position.set(x,4,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.8,4,7),new THREE.MeshStandardMaterial({color:0x176b42}));crown.position.set(x,7,z);scene.add(trunk,crown)}
 for(let i=0;i<8;i++){const a=i*Math.PI/4,x=Math.cos(a)*24,z=Math.sin(a)*24,g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(7,4,6),new THREE.MeshStandardMaterial({color:[0xb77c52,0x8d9eae,0xd0b46a][i%3]})),roof=new THREE.Mesh(new THREE.ConeGeometry(5.5,3,4),new THREE.MeshStandardMaterial({color:0x3d405c}));body.position.y=5;roof.position.y=8.2;roof.rotation.y=Math.PI/4;g.add(body,roof);g.position.set(x,0,z);scene.add(g)}
 player=character(0x31c7ff);player.position.set(0,3.2,0);scene.add(player);bots=[];
 for(let i=0;i<12;i++){const b=character([0xff745d,0xffca55,0xb68cff][i%3]),a=i/12*Math.PI*2,r=22+Math.random()*22;b.position.set(Math.cos(a)*r,3.2,Math.sin(a)*r);b.userData={hp:100,fire:1+Math.random()*2};scene.add(b);bots.push(b)}
}
function updateHud(){$('hp').style.width=health+'%';$('shield').style.width=shield+'%';$('kills').textContent=kills;$('alive').textContent=1+bots.filter(b=>b.userData.hp>0).length;$('clock').textContent='0'+Math.floor(timeLeft/60)+':'+String(Math.max(0,Math.floor(timeLeft%60))).padStart(2,'0')}
function end(win){active=false;$('resultTitle').textContent=win?'VÍTĚZSTVÍ!':'KONEC HRY';$('resultText').textContent=`Eliminace: ${kills} · ${win?'Ostrov je tvůj!':'Zkus to znovu.'}`;$('result').style.display='flex'}
function shoot(){if(!active)return;const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));let target=null,best=18;for(const b of bots){if(b.userData.hp<=0)continue;const d=new THREE.Vector3().subVectors(b.position,player.position),dist=d.length();d.y=0;d.normalize();if(d.dot(dir)>.88&&dist<best){best=dist;target=b}}if(target){target.userData.hp-=50;if(target.userData.hp<=0){scene.remove(target);kills++;updateHud()}}}
function start(){health=100;shield=50;kills=0;timeLeft=180;yaw=0;pitch=-.22;velY=0;active=true;makeWorld();$('menu').style.display='none';$('result').style.display='none';last=0;requestAnimationFrame(animate)}
function animate(t){if(!active)return;requestAnimationFrame(animate);const dt=Math.min((t-last)/1000||.016,.05);last=t;timeLeft-=dt;if(timeLeft<=0){end(bots.every(b=>b.userData.hp<=0));return}
 const forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-move.y,side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+move.x,speed=12;
 player.position.x+=(side*Math.cos(yaw)-forward*Math.sin(yaw))*speed*dt;player.position.z+=(-forward*Math.cos(yaw)-side*Math.sin(yaw))*speed*dt;
 const r=Math.hypot(player.position.x,player.position.z);if(r>57){player.position.x*=57/r;player.position.z*=57/r}
 if(keys.Space&&player.position.y<=3.21)velY=8;velY-=22*dt;player.position.y+=velY*dt;if(player.position.y<3.2){player.position.y=3.2;velY=0}player.rotation.y=yaw;
 for(const b of bots){if(b.userData.hp<=0)continue;const d=player.position.clone().sub(b.position);d.y=0;const dist=d.length();if(dist>7){d.normalize();b.position.addScaledVector(d,dt*3.2);b.rotation.y=Math.atan2(-d.x,-d.z)}else{b.userData.fire-=dt;if(b.userData.fire<=0){const dmg=6;if(shield>0)shield=Math.max(0,shield-dmg);else health=Math.max(0,health-dmg);b.userData.fire=1.2+Math.random();if(health<=0){updateHud();end(false)}}}}
 camera.position.set(player.position.x+Math.sin(yaw)*9,player.position.y+5-pitch*4,player.position.z+Math.cos(yaw)*9);camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);updateHud();renderer.render(scene,camera)}
$('start').onclick=start;$('back').onclick=()=>{$('result').style.display='none';$('menu').style.display='flex'};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
$('fire').onclick=shoot;$('jump').onclick=()=>{if(player&&player.position.y<=3.3)velY=8};
const stick=$('stick'),nub=$('nub');let touchId=null;stick.addEventListener('pointerdown',e=>{touchId=e.pointerId;stick.setPointerCapture(touchId);moveFrom(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===touchId)moveFrom(e)});function moveFrom(e){const r=stick.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),len=Math.hypot(x,y),m=Math.min(38,len);if(len){x=x/len*m;y=y/len*m}nub.style.transform=`translate(${x}px,${y}px)`;move={x:x/38,y:y/38}}stick.addEventListener('pointerup',()=>{touchId=null;move={x:0,y:0};nub.style.transform=''});
let look=null;root.addEventListener('touchstart',e=>{if(e.touches[0].clientX>innerWidth*.45)look={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});root.addEventListener('touchmove',e=>{if(look&&e.touches[0].clientX>innerWidth*.45){const q=e.touches[0];yaw-=(q.clientX-look.x)*.006;pitch=Math.max(-.8,Math.min(.6,pitch+(q.clientY-look.y)*.003));look={x:q.clientX,y:q.clientY}}},{passive:true});root.addEventListener('touchend',()=>look=null);
root.addEventListener('click',()=>{if(active&&matchMedia('(pointer:fine)').matches){renderer.domElement.requestPointerLock?.();shoot()}});
addEventListener('mousemove',e=>{if(active&&document.pointerLockElement){yaw-=e.movementX*.003;pitch=Math.max(-.8,Math.min(.6,pitch+e.movementY*.002))}});
addEventListener('resize',()=>{if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}});
})();
</script><script>if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script>
</body></html>
